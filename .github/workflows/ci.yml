name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pilot
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: pilot_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Alembic Upgrade & Autogenerate Check
        env:
          DATABASE_URL: postgresql+psycopg://pilot:pilot_password@localhost:5432/pilot
          PILOT_ENV: test
        run: |
          alembic upgrade head
          alembic check

      - name: Run Test Suite (Alembic & Constraints)
        env:
          DATABASE_URL: postgresql+psycopg://pilot:pilot_password@localhost:5432/pilot
          PILOT_ENV: test
        run: pytest -v
